name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-latest, goos: linux, goarch: "386" }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-latest, goos: linux, goarch: arm, goarm: "7" }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64 }
          - { runner: ubuntu-latest, goos: linux, goarch: loong64 }
          - { runner: ubuntu-latest, goos: linux, goarch: mips }
          - { runner: ubuntu-latest, goos: linux, goarch: mips64 }
          - { runner: ubuntu-latest, goos: linux, goarch: mips64le }
          - { runner: ubuntu-latest, goos: linux, goarch: mipsle }
          - { runner: ubuntu-latest, goos: linux, goarch: ppc64 }
          - { runner: ubuntu-latest, goos: linux, goarch: ppc64le }
          - { runner: ubuntu-latest, goos: linux, goarch: riscv64 }
          - { runner: ubuntu-latest, goos: linux, goarch: s390x }
          - { runner: macos-latest, goos: darwin, goarch: amd64 }
          - { runner: macos-latest, goos: darwin, goarch: arm64 }
          - { runner: macos-latest, goos: ios, goarch: amd64 }
          - { runner: macos-latest, goos: ios, goarch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute artifact name
        id: name
        run: |
          GOOS="${{ matrix.target.goos }}"
          GOARCH="${{ matrix.target.goarch }}"
          GOARM="${{ matrix.target.goarm }}"
          if [[ -n "${GOARM}" ]]; then
            echo "artifact=mcp-uapi-${GOOS}-${GOARCH}-v${GOARM}" >> "${GITHUB_OUTPUT}"
          else
            echo "artifact=mcp-uapi-${GOOS}-${GOARCH}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        run: |
          TARGET="${{ matrix.target.goos }}/${{ matrix.target.goarch }}"
          GOARM="${{ matrix.target.goarm }}"
          if [[ -n "${GOARM}" ]]; then
            TARGET="${TARGET}/v${GOARM}"
          fi
          ./scripts/build-target.sh "${TARGET}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.name.outputs.artifact }}"
          path: "bin/${{ steps.name.outputs.artifact }}"

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## ${{ github.ref_name }}

            Pre-built binaries for all supported targets.

            | File | Platform | GOOS | GOARCH |
            |------|----------|------|--------|
            | mcp-uapi-linux-386 | Linux | linux | 386 |
            | mcp-uapi-linux-amd64 | Linux | linux | amd64 |
            | mcp-uapi-linux-arm-v7 | Linux | linux | arm (v7) |
            | mcp-uapi-linux-arm64 | Linux | linux | arm64 |
            | mcp-uapi-linux-loong64 | Linux | linux | loong64 |
            | mcp-uapi-linux-mips | Linux | linux | mips |
            | mcp-uapi-linux-mips64 | Linux | linux | mips64 |
            | mcp-uapi-linux-mips64le | Linux | linux | mips64le |
            | mcp-uapi-linux-mipsle | Linux | linux | mipsle |
            | mcp-uapi-linux-ppc64 | Linux | linux | ppc64 |
            | mcp-uapi-linux-ppc64le | Linux | linux | ppc64le |
            | mcp-uapi-linux-riscv64 | Linux | linux | riscv64 |
            | mcp-uapi-linux-s390x | Linux | linux | s390x |
            | mcp-uapi-darwin-amd64 | macOS | darwin | amd64 |
            | mcp-uapi-darwin-arm64 | macOS | darwin | arm64 |
            | mcp-uapi-ios-amd64 | iOS simulator | ios | amd64 |
            | mcp-uapi-ios-arm64 | iOS device | ios | arm64 |
          files: artifacts/*/mcp-uapi-*
          generate_release_notes: true
